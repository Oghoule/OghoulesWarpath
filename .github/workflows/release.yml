name: Package addon
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OghoulesWarpath
      - name: Create zip
        run: |
          rm -rf OghoulesWarpath/.git OghoulesWarpath/.github
          zip -r OghoulesWarpath.zip OghoulesWarpath
      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" OghoulesWarpath.zip --clobber --repo "${{ github.repository }}"
